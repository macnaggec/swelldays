<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preload" as="image" type="image/webp" href="/first-visit-waves-landscape.webp"
    media="(min-width: 768px)" />
  <link rel="preload" as="image" type="image/webp" href="/first-visit-waves-portrait.webp"
    media="(max-width: 767px)" />
  <link rel="preload" as="image" type="image/png" href="/swelldays-logo-white.png" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="description"
    content="Swelldays is an interactive map for finding, buying, and selling surf-spot photos and videos, searchable by date." />
  <meta property="og:title" content="Swelldays | Buy and Sell Surf Photos & Videos" />
  <meta property="og:description"
    content="An interactive map for finding, buying, and selling surf-spot photos and videos, searchable by date." />
  <meta property="og:image" content="/android-chrome-512x512.png" />
  <meta property="og:type" content="website" />
  <title>Swelldays | Buy and Sell Surf Photos & Videos</title>
  <style>
    [data-bootstrap-shell] {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: rgba(244, 249, 250, 0.82);
      background:
        radial-gradient(ellipse at 50% 68%, rgba(46, 111, 142, 0.16), transparent 48%),
        #0a1628;
    }

    [data-bootstrap-shell] img {
      width: min(180px, 46vw);
      height: auto;
    }

    [data-bootstrap-shell]::after {
      position: absolute;
      bottom: 12%;
      width: min(180px, 42vw);
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(244, 249, 250, 0.32), transparent);
    }
  </style>
</head>

<body>
  <div id="root">
    <div data-bootstrap-shell aria-hidden="true">
      <img src="/swelldays-logo-white.png" alt="" width="600" height="272" fetchpriority="high" />
    </div>
  </div>
  <script type="module" src="/src/app/main.tsx"></script>
  <!-- Cloudflare Web Analytics -->
  <script>
    window.addEventListener('load', () => {
      const cloudflareBeacon = document.createElement('script');
      cloudflareBeacon.type = 'module';
      cloudflareBeacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
      cloudflareBeacon.dataset.cfBeacon = '{"token": "c3f9d84b1b584df99da5d2d1cef59056"}';
      document.body.append(cloudflareBeacon);
    }, { once: true });
  </script>
  <!-- End Cloudflare Web Analytics -->
</body>

</html>
