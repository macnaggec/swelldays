server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/css
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    application/wasm;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location = /release.txt {
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location ~ ^/(?:site\.webmanifest|favicon\.ico|favicon(?:-(?:16x16|32x32))?\.png|apple-touch-icon\.png|android-chrome-(?:192x192|512x512)\.png)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # Keep transactional UI on the web origin; crawlers must read this header.
  # Serving the file here avoids a try_files internal redirect losing noindex.
  location ~ ^/(?:cart|checkout|upload|me|admin|auth|order-success)(?:/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =503;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
