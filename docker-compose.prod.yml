services:

  api:
    image: ghcr.io/macnaggec/swelldays-api:${RELEASE_TAG}
    restart: unless-stopped
    env_file:
      - apps/api/.env.production
    networks:
      - default
      - web
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: ghcr.io/macnaggec/swelldays-migrator:${RELEASE_TAG}
    env_file:
      - apps/api/.env.production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: surfdb
      POSTGRES_USER: surfuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfuser -d surfdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/macnaggec/swelldays-web:${RELEASE_TAG}
    restart: unless-stopped
    networks:
      - web

volumes:
  postgres_data:

networks:
  web:
    external: true
