services:

  api:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: surfdb
      POSTGRES_USER: surfuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfuser -d surfdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
