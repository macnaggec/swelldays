name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Type-check client
        run: npx tsc --noEmit

      - name: Type-check server
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Check style boundaries
        run: npm run check:style-boundaries

      - name: Run client, server, and scripts tests
        run: npx vitest run --project client --project server --project scripts

      - name: Start integration-test database
        run: npm run test:db:up

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop integration-test database
        if: always()
        run: npm run test:db:down

  artifacts:
    name: Production artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build API runtime image
        run: docker build --file apps/api/Dockerfile --target runner --tag swelldays-api:ci .

      - name: Build web runtime image
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --target runner \
            --build-arg RELEASE_TAG=ci \
            --build-arg VITE_API_URL=https://api.example.test \
            --build-arg VITE_MAPBOX_ACCESS_TOKEN=pk.test-placeholder \
            --build-arg VITE_GOOGLE_CLIENT_ID=test-client.apps.googleusercontent.com \
            --build-arg VITE_GOOGLE_API_KEY=test-google-api-key \
            --build-arg VITE_CLOUDINARY_CLOUD_NAME=test-cloud \
            --build-arg VITE_CLOUDINARY_API_KEY=test-cloudinary-key \
            --tag swelldays-web:ci \
            .

      - name: Start web runtime image
        run: docker run --detach --name swelldays-web-ci --publish 127.0.0.1:18080:8080 swelldays-web:ci

      - name: Verify web delivery
        run: npm run check:web-delivery -- --origin http://127.0.0.1:18080 --expected-release ci

      - name: Stop web runtime image
        if: always()
        run: docker rm --force swelldays-web-ci || true
